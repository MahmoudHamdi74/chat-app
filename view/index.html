<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/1c2427417b.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./style.css" />
    <script src="/socket.io/socket.io.js"></script>
    <script src="./socket.io.min.js"></script>
    <title>socket.io Chat</title>
    <meta name="description" content="Private real-time chat" />
    <meta name="theme-color" content="#343541" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <style>
      #toast{position:fixed;top:15px;left:50%;transform:translateX(-50%) translateY(-80px);background:#10a37f;color:#fff;padding:12px 20px;border-radius:10px;z-index:2000;transition:.3s;font-size:15px;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      #toast.show{transform:translateX(-50%) translateY(0)}
      #peer-screen{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;background:rgba(26,26,26,.95);gap:15px;padding:40px;border-radius:12px;z-index:1000;box-shadow:0 8px 32px rgba(0,0,0,.5);width:min(440px,92vw)}
      #peer-screen h2{color:#fff;font-size:26px}
      #peer-screen p{color:#828E9E}
      #peer-input{width:100%;max-width:400px;padding:15px 20px;font-size:18px;border:2px solid #40414F;border-radius:8px;background:#343541;color:#fff;outline:none}
      #start-peer{width:100%;max-width:400px;padding:15px;font-size:18px;font-weight:600;color:#fff;background:#10a37f;border:none;border-radius:8px;cursor:pointer}
      #contacts{display:flex;flex-direction:column;gap:8px;width:100%;max-width:400px;max-height:200px;overflow-y:auto}
      .contact{display:flex;justify-content:space-between;align-items:center;background:#343541;border:1px solid #40414F;border-radius:8px;padding:10px 14px;color:#fff;cursor:pointer;font-size:16px}
      #btn-new{background:#40414F;color:#fff;border:1px solid #6B6C7B;border-radius:7px;padding:5px 10px;cursor:pointer;font-size:13px;margin-inline-start:8px}
      .app-logo{border-radius:8px;flex-shrink:0}
      .msg-menu-wrap{position:relative;float:left}
      .msg-menu-btn{background:none;border:none;cursor:pointer;color:#fff;font-size:16px;opacity:.85;padding:0 4px;line-height:1}
      .msg-menu{position:absolute;top:110%;left:0;display:flex;flex-direction:column;gap:2px;background:#2E2F3A;border:1px solid #6B6C7B;border-radius:8px;padding:6px;z-index:30;min-width:110px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
      .msg-menu button{background:none;border:none;color:#fff;cursor:pointer;font-size:14px;text-align:start;padding:6px 10px;border-radius:6px;white-space:nowrap}
      .msg-menu button:hover{background:#40414F}
      #btn-logout,#btn-notif{background:#40414F;color:#fff;border:1px solid #6B6C7B;border-radius:7px;padding:5px 10px;cursor:pointer;font-size:13px;margin-inline-start:8px;white-space:nowrap}
      .nav-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
      #chat-title{min-width:0;flex:1;overflow:hidden}
      #chat-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      @media (max-width:480px){
        #btn-new,#btn-logout,#btn-notif{font-size:12px;padding:4px 6px;margin-inline-start:0}
        .nav-actions{gap:4px}
        #chat-title{font-size:15px}
        .nav-bar .close{display:none}
      }
    </style>
  </head>
  <body>
    <div id="toast"></div>
    <div id="conn-status" style="position:fixed;bottom:5px;left:50%;transform:translateX(-50%);color:#828E9E;font-size:12px;z-index:2000;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:10px">connecting...</div>
    <form class="container" id="message-form" style="display: none;">
      <div class="nav-bar">
        <a id="chat-title" style="display:flex;align-items:center;gap:8px"><svg class="app-logo" viewBox="0 0 48 48" width="28" height="28" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12b886"/><stop offset="1" stop-color="#0b6e54"/></linearGradient></defs><rect x="2" y="2" width="44" height="44" rx="12" fill="url(#lg)"/><path d="M13 15h22a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H24l-7 7v-7h-4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z" fill="#fff"/><circle cx="20" cy="21.5" r="2" fill="#0b6e54"/><circle cx="25" cy="21.5" r="2" fill="#0b6e54"/><circle cx="30" cy="21.5" r="2" fill="#0b6e54"/></svg><span>Chat</span></a>
        <div class="nav-actions">
        <button type="button" id="btn-new" title="chat with someone else">New Chat ➕</button>
        <button type="button" id="btn-notif" title="Enable notifications">🔔</button>
        <button type="button" id="btn-logout" title="Log out">Logout</button>
        </div>
        <div class="close">
          <div class="line one"></div>
          <div class="line two"></div>
        </div>
      </div>
      <div class="messages-area">
        <h1 id="message-container"></h1>
      </div>
      <div class="sender-area">
        <div class="input-place">
          <input
            type="text"
            name="message"
            class="send-input"
            id="message-input"
            placeholder="Type your message here"
          />
          <div class="send">
            <button type="submit" class="send-button">
              <svg
                class="send-icon"
                version="1.1"
                id="Capa_1"
                xmlns="http://www.w3.org/2000/svg"
                xmlns:xlink="http://www.w3.org/1999/xlink"
                x="0px"
                y="0px"
                viewBox="0 0 512 512"
                style="enable-background: new 0 0 512 512"
                xml:space="preserve"
              >
                <g>
                  <g>
                    <path
                      fill="#6B6C7B"
                      d="M481.508,210.336L68.414,38.926c-17.403-7.222-37.064-4.045-51.309,8.287C2.86,59.547-3.098,78.551,1.558,96.808 L38.327,241h180.026c8.284,0,15.001,6.716,15.001,15.001c0,8.284-6.716,15.001-15.001,15.001H38.327L1.558,415.193 c-4.656,18.258,1.301,37.262,15.547,49.595c14.274,12.357,33.937,15.495,51.31,8.287l413.094-171.409 C500.317,293.862,512,276.364,512,256.001C512,235.638,500.317,218.139,481.508,210.336z"
                    ></path>
                  </g>
                </g>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div></div>
    </form>

    <div id="username-screen">
      <h2>Enter your name</h2>
      <input
        id="username-input"
        type="text"
        placeholder="Enter your name"
      />
      <button id="start-chat">
        Start
      </button>
    </div>

    <div id="peer-screen">
      <h2>Who do you want to chat with?</h2>
      <p id="hello"></p>
      <input id="peer-input" type="text" placeholder="Other person's username" />
      <button id="start-peer">Start chat</button>
      <h3 style="color:#fff;font-size:16px">Previous chats</h3>
      <div id="contacts"></div>
    </div>

    <form class="container-blur" id="message-form-blur">
      <div class="nav-bar">
        <a>Chat</a>
        <div class="close">
          <div class="line one"></div>
          <div class="line two"></div>
        </div>
      </div>
      <div class="messages-area">
        <h1 id="message-container"></h1>
      </div>
      <div class="sender-area">
        <div class="input-place">
          <input
            type="text"
            name="message"
            class="send-input"
            id="message-input"
            placeholder="Type your message here"
          />
          <div class="send">
            <button type="submit" class="send-button">
              <svg
                class="send-icon"
                version="1.1"
                id="Capa_1"
                xmlns="http://www.w3.org/2000/svg"
                xmlns:xlink="http://www.w3.org/1999/xlink"
                x="0px"
                y="0px"
                viewBox="0 0 512 512"
                style="enable-background: new 0 0 512 512"
                xml:space="preserve"
              >
                <g>
                  <g>
                    <path
                      fill="#6B6C7B"
                      d="M481.508,210.336L68.414,38.926c-17.403-7.222-37.064-4.045-51.309,8.287C2.86,59.547-3.098,78.551,1.558,96.808 L38.327,241h180.026c8.284,0,15.001,6.716,15.001,15.001c0,8.284-6.716,15.001-15.001,15.001H38.327L1.558,415.193 c-4.656,18.258,1.301,37.262,15.547,49.595c14.274,12.357,33.937,15.495,51.31,8.287l413.094-171.409 C500.317,293.862,512,276.364,512,256.001C512,235.638,500.317,218.139,481.508,210.336z"
                    ></path>
                  </g>
                </g>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div></div>
    </form>

    <!-- <div id="message-container"></div>
    <form action="" id="message-form">
        <button type="submit" class="w-2 "><i class="fa-solid fa-paper-plane"></i></button>
    </form> -->
  </body>
  <script>
    const SOCKET_URL = (location.port === "3000") ? undefined : `http://${location.hostname || "localhost"}:3000`;
    const socket = window.io(SOCKET_URL);
    const connStatus = () => document.getElementById("conn-status");
    function setStatus(t) { const el = connStatus(); el.textContent = t; el.style.display = "block"; clearTimeout(setStatus.t); setStatus.t = setTimeout(() => { el.style.display = "none"; }, 5000); }
    socket.on("connect", () => { console.log("connected:", socket.id, "via", SOCKET_URL || "same-origin"); setStatus("✅ connected " + socket.id.slice(0,5) + " as " + (username || "?")); });
    socket.on("disconnect", () => { setStatus("❌ disconnected"); });
    socket.on("connect_error", (e) => { console.log("connect_error:", e.message, "-> open http://localhost:3000 instead of Live Server"); setStatus("❌ connect_error: " + e.message + " (URL=" + (SOCKET_URL || "same-origin") + ")"); });
    const form = document.getElementById("message-form");
    const input = document.getElementById("message-input");
    const messageContainer = document.getElementById("message-container");
    form.onsubmit = (e) => {
      e.preventDefault();
      const message = input.value;
      socket.emit("send-message", { message, username });
      messageContainer.innerHTML += `<h1 style="background-color: #10a37f; margin-block: 10px;">You: ${message}</h1>`;
      input.value = "";
    };
    socket.on("send-message", ({ message, username }) => {
      messageContainer.innerHTML += `<h1 style="background-color: #6B6C7B;text-align:right; margin-block: 10px;">${message} : ${username}</h1>`;
    });


    let username = sessionStorage.getItem("pc_myname") || "";

    const usernameScreen = document.getElementById("username-screen");
    const messageForm = document.getElementById("message-form");
    const messageFormBlur = document.getElementById("message-form-blur");
    const usernameInput = document.getElementById("username-input");
    const startBtn = document.getElementById("start-chat");

    startBtn.addEventListener("click", () => {
        const name = usernameInput.value.trim();

        if (name === "") {
            alert("Enter your name to start the chat");
            return;
        }

        tryRegister(name, (ok) => {
          if (!ok) return;
          usernameScreen.style.display = "none";
          document.getElementById("peer-screen").style.display = "flex";
          document.getElementById("hello").textContent = "Hello " + username;
          renderContacts();
        });
    });

    // ---- added: private chat + notifications + persistence (original code kept above) ----
    let peer = "";
    let audioCtx = null;
    const peerScreen = document.getElementById("peer-screen");
    const toastEl = document.getElementById("toast");
    const msgKey = (m) => m.id || (m.at + "|" + m.from + "|" + m.message);
    function tryRegister(name, cb) {
      socket.emit("register", { username: name }, (res) => {
        if (!res || !res.ok) {
          if (res && res.error === "taken") alert("Username '" + name + "' is already used on another device. Pick another one.");
          else alert("Registration failed. Check your connection and try again.");
          if (cb) cb(false);
          return;
        }
        username = name;
        sessionStorage.setItem("pc_myname", username);
        localStorage.setItem("pc_myname", username);
        if ("Notification" in window && Notification.permission === "default") { try { Notification.requestPermission().then(() => refreshNotifBtn()).catch(() => {}); } catch (e) {} }
        if (cb) cb(true);
      });
    }
    const histKey = () => `pc_chat_${username.toLowerCase()}::${peer.toLowerCase()}`;
    const loadHist = () => { try { return JSON.parse(localStorage.getItem(histKey()) || "[]"); } catch { return []; } };
    const saveHist = (h) => localStorage.setItem(histKey(), JSON.stringify(h.slice(-500)));
    const getContacts = () => { try { return JSON.parse(localStorage.getItem(`pc_contacts_${username.toLowerCase()}`) || "[]"); } catch { return []; } };
    function renderContacts() {
      const box = document.getElementById("contacts");
      if (!box) return;
      const c = getContacts();
      box.innerHTML = c.length ? "" : '<small style="color:#828E9E">No chats yet</small>';
      c.forEach((name) => {
        const d = document.createElement("div");
        d.className = "contact";
        d.textContent = name;
        d.onclick = () => openChat(name);
        box.appendChild(d);
      });
    }
    function addContact(p) {
      if (!username) return;
      let c = getContacts();
      c = [p, ...c.filter((x) => x.toLowerCase() !== p.toLowerCase())].slice(0, 20);
      localStorage.setItem(`pc_contacts_${username.toLowerCase()}`, JSON.stringify(c));
      renderContacts();
    }
    function showToast(t) { toastEl.textContent = t; toastEl.classList.add("show"); clearTimeout(showToast.t); showToast.t = setTimeout(() => toastEl.classList.remove("show"), 3000); }
    function beep() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 880; g.gain.value = 0.15; o.start(); o.stop(audioCtx.currentTime + 0.25); } catch (e) {} }
    function notifyMsg(m) {
      beep();
      showToast("📩 " + m.from + ": " + String(m.message).slice(0, 60));
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      const title = "Message from " + m.from;
      const opts = { body: String(m.message).slice(0, 200), icon: "./icon.svg", tag: "msg-" + (m.id || m.at) };
      try {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistration().then((reg) => {
            if (reg) reg.showNotification(title, opts);
            else { try { new Notification(title, opts); } catch (e) {} }
          }).catch(() => { try { new Notification(title, opts); } catch (e) {} });
        } else { try { new Notification(title, opts); } catch (e) {} }
      } catch (e) {}
    }
    function refreshNotifBtn() {
      const b = document.getElementById("btn-notif");
      if (!b || !("Notification" in window)) return;
      b.textContent = Notification.permission === "granted" ? "🔔" : "🔕";
      b.title = "Notifications: " + Notification.permission + " (tap to enable)";
    }
    function openChat(peerName) {
      peerName = String(peerName || document.getElementById("peer-input").value || "").trim();
      if (!peerName) { alert("Enter the other person's username"); return; }
      if (peerName.toLowerCase() === username.toLowerCase()) { alert("You can't chat with yourself"); return; }
      peer = peerName;
      addContact(peer);
      try { localStorage.setItem("pc_lastpeer_" + username.toLowerCase(), peer); } catch (e) {}
      document.getElementById("chat-title").textContent = username + " ↔ " + peer;
      peerScreen.style.display = "none";
      messageFormBlur.style.display = "none";
      messageForm.style.display = "flex";
      messageContainer.innerHTML = "";
      loadHist().forEach((m) => appendMsg(m, m.from === username));
      fetchHistory(false);
    }
    function fetchHistory(countNew) {
      if (!peer) return;
      socket.emit("get-history", { withUser: peer }, (srv) => {
        if (!srv) return;
        const local = loadHist();
        const seen = new Set(local.map(msgKey));
        const fresh = srv.filter((m) => !seen.has(msgKey(m)));
        const merged = [...local, ...fresh].sort((a, b) => a.at - b.at).slice(-500);
        messageContainer.innerHTML = "";
        merged.forEach((m) => appendMsg(m, m.from === username));
        saveHist(merged);
        if (countNew) {
          const n = fresh.filter((m) => String(m.from).toLowerCase() !== username.toLowerCase()).length;
          if (n > 0) showToast("📩 " + n + " new message" + (n > 1 ? "s" : "") + " from " + peer);
        }
      });
    }
    function appendMsg(m, mine) {
      const edited = m.edited ? ' <small style="opacity:.6">(edited)</small>' : "";
      const menu = (mine && m.id)
        ? `<span class="msg-menu-wrap"><button class="msg-menu-btn" onclick="toggleMsgMenu(event,'${m.id}')" title="Options">⋮</button><span class="msg-menu" id="mm-${m.id}" style="display:none"><button onclick="editMsg('${m.id}')">✏️ Edit</button><button onclick="deleteMsg('${m.id}')">🗑 Delete</button></span></span>`
        : "";
      messageContainer.innerHTML += mine
        ? `<h1 data-mid="${m.id || ""}" style="background-color: #10a37f; margin-block: 10px;">${menu}You: ${m.message}${edited}</h1>`
        : `<h1 data-mid="${m.id || ""}" style="background-color: #6B6C7B;text-align:right; margin-block: 10px;">${m.message} : ${m.from}${edited}</h1>`;
    }
    function closeAllMenus() { document.querySelectorAll(".msg-menu").forEach((el) => { el.style.display = "none"; }); }
    window.toggleMsgMenu = (e, id) => {
      if (e) e.stopPropagation();
      const el = document.getElementById("mm-" + id);
      const wasHidden = !el || el.style.display === "none";
      closeAllMenus();
      if (el && wasHidden) el.style.display = "flex";
    };
    document.addEventListener("click", () => closeAllMenus());
    function refreshCurrentView() {
      messageContainer.innerHTML = "";
      loadHist().forEach((m) => appendMsg(m, m.from === username));
    }
    function convKey(other) { return `pc_chat_${username.toLowerCase()}::${String(other).toLowerCase()}`; }
    function upsertLocalMsg(m) {
      const other = String(m.from).toLowerCase() === username.toLowerCase() ? m.to : m.from;
      const k = convKey(other);
      try {
        const h = JSON.parse(localStorage.getItem(k) || "[]");
        const i = h.findIndex((x) => x.id && x.id === m.id);
        if (i >= 0) h[i] = m; else h.push(m);
        localStorage.setItem(k, JSON.stringify(h.slice(-500)));
      } catch (e) {}
      if (peer && String(other).toLowerCase() === peer.toLowerCase()) refreshCurrentView();
    }
    function removeLocalMsg(id, from) {
      const other = String(from).toLowerCase() === username.toLowerCase() ? peer : from;
      const k = convKey(other || peer);
      try {
        const h = JSON.parse(localStorage.getItem(k) || "[]").filter((x) => x.id !== id);
        localStorage.setItem(k, JSON.stringify(h.slice(-500)));
      } catch (e) {}
      const el = messageContainer.querySelector(`[data-mid="${id}"]`);
      if (el) el.remove();
    }
    window.editMsg = (id) => {
      closeAllMenus();
      const h = loadHist();
      const m = h.find((x) => x.id === id);
      if (!m) return;
      const v = prompt("Edit message:", m.message);
      if (v === null || v.trim() === "" || v.trim() === m.message) return;
      socket.emit("edit-message", { withUser: peer, id, message: v.trim() }, (res) => {
        if (!res || !res.ok) { alert("Edit failed"); return; }
        m.message = v.trim(); m.edited = true; saveHist(h); refreshCurrentView();
      });
    };
    window.deleteMsg = (id) => {
      closeAllMenus();
      if (!confirm("Delete this message?")) return;
      socket.emit("delete-message", { withUser: peer, id }, (res) => {
        if (!res || !res.ok) { alert("Delete failed"); return; }
        saveHist(loadHist().filter((x) => x.id !== id)); refreshCurrentView();
      });
    };
    socket.on("message-edited", (m) => { if (username) upsertLocalMsg(m); });
    socket.on("message-deleted", ({ id, from }) => { if (username && id) removeLocalMsg(id, from); });
    document.getElementById("start-peer").addEventListener("click", () => openChat());
    document.getElementById("btn-new").addEventListener("click", () => {
      messageForm.style.display = "none";
      peerScreen.style.display = "flex";
      peer = "";
      try { localStorage.removeItem("pc_lastpeer_" + username.toLowerCase()); } catch (e) {}
      renderContacts();
    });
    document.getElementById("btn-notif").addEventListener("click", () => {
      if (!("Notification" in window)) { alert("Notifications not supported here"); return; }
      Notification.requestPermission().then(() => {
        refreshNotifBtn();
        setStatus(Notification.permission === "granted" ? "🔔 notifications enabled" : "🔕 notifications: " + Notification.permission);
      }).catch(() => refreshNotifBtn());
    });
    document.getElementById("btn-logout").addEventListener("click", () => {
      if (!confirm("Log out of '" + username + "'?")) return;
      try {
        localStorage.removeItem("pc_myname");
        localStorage.removeItem("pc_lastpeer_" + username.toLowerCase());
        sessionStorage.removeItem("pc_myname");
      } catch (e) {}
      socket.emit("logout");
      username = ""; peer = ""; restorePeer = "";
      messageContainer.innerHTML = "";
      usernameInput.value = "";
      messageForm.style.display = "none";
      peerScreen.style.display = "none";
      messageFormBlur.style.display = "";
      usernameScreen.style.display = "";
      setStatus("👋 logged out");
    });
    refreshNotifBtn();
    form.onsubmit = (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      if (!peer) { alert("Choose who to chat with first"); return; }
      console.log("SEND to=" + peer + " msg=" + message + " connected=" + socket.connected);
      setStatus("📤 sending to " + peer + "...");
      const msgObj = { id: "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), from: username, to: peer, message, at: Date.now() };
      socket.emit("private-message", { to: peer, message, id: msgObj.id });
      appendMsg(msgObj, true);
      const h = loadHist(); h.push(msgObj); saveHist(h);
      addContact(peer);
      input.value = "";
    };
    socket.on("private-message", (m) => {
      console.log("RECV", JSON.stringify(m));
      if (!username) return;
      const k = `pc_chat_${username.toLowerCase()}::${String(m.from).toLowerCase()}`;
      try {
        const h = JSON.parse(localStorage.getItem(k) || "[]");
        if (!h.some((x) => x.id && x.id === m.id)) h.push(m);
        localStorage.setItem(k, JSON.stringify(h.slice(-500)));
      } catch (e) {}
      addContact(m.from);
      if (peer && m.from.toLowerCase() === peer.toLowerCase()) {
        appendMsg(m, false);
      } else {
        showToast("📩 " + m.from + ": " + String(m.message).slice(0, 60) + " click to view");
        toastEl.onclick = () => { document.getElementById("peer-input").value = m.from; openChat(m.from); toastEl.classList.remove("show"); };
      }
      notifyMsg(m);
    });
    let restorePeer = "";
    try {
      const savedName = sessionStorage.getItem("pc_myname") || localStorage.getItem("pc_myname");
      if (savedName && !username) {
        username = savedName;
        usernameInput.value = savedName;
        restorePeer = localStorage.getItem("pc_lastpeer_" + savedName.toLowerCase()) || "";
      }
    } catch (e) {}
    if (username) { usernameInput.value = username; }
    let regRetries = 0;
    function handleRegAck(nameToReg, res) {
      if (!res || !res.ok) {
        if (res && res.error === "taken" && regRetries < 5) {
          regRetries++;
          setStatus("🔄 reconnecting (" + regRetries + ")...");
          setTimeout(() => {
            if (username === nameToReg && nameToReg) socket.emit("register", { username: nameToReg }, (r) => handleRegAck(nameToReg, r));
          }, 2500);
          return;
        }
        if (res && res.error === "taken") {
          alert("Username '" + nameToReg + "' is in use on another device. If that was you, close the other tab/app and tap Start.");
          usernameInput.value = nameToReg;
          username = "";
          usernameScreen.style.display = "";
          peerScreen.style.display = "none";
          messageForm.style.display = "none";
        }
        return;
      }
      regRetries = 0;
      username = nameToReg;
      try { sessionStorage.setItem("pc_myname", username); localStorage.setItem("pc_myname", username); } catch (e) {}
      if (usernameScreen.style.display !== "none" && !peer && !restorePeer) {
        usernameScreen.style.display = "none";
        peerScreen.style.display = "flex";
        document.getElementById("hello").textContent = "Hello " + username;
        renderContacts();
      }
      if (restorePeer) { const p = restorePeer; restorePeer = ""; openChat(p); }
      else if (peer) fetchHistory(true);
    }
    socket.on("connect", () => {
      const nameToReg = username || sessionStorage.getItem("pc_myname") || "";
      if (!nameToReg) return;
      socket.emit("register", { username: nameToReg }, (res) => handleRegAck(nameToReg, res));
    });
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</html>
